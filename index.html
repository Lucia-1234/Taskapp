<!DOCTYPE html>
<html lang="es" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskApp - Gestión de Tareas</title>
    <link rel="stylesheet" href="./src/styles/main.css">
</head>

<body>
    <main>
        <div class="container">
        <!-- Encabezado principal -->
        <header class="header">
            <h1 class="header__title">Registro de Mensajes grupo 3</h1>
            <p class="header__subtitle">Practica la manipulación del DOM en tiempo real</p>
        </header>

        <!-- Formulario de búsqueda de usuario -->
        <section class="form-section">
            <div class="card">
                <h2 class="card__title">Buscar Usuario</h2>
                <div id="listaUsuariosDisponibles" class="user-list-container hidden">
                    <div class="user-list-title">Usuarios Disponibles</div>
                    <div id="usuariosItemsContainer"></div>
                </div>
                <form id="formUsuario" class="form" novalidate>
                    <div class="form__group">
                        <label for="usuarioId" class="form__label">ID de Usuario</label>
                        <input type="number" id="usuarioId" class="form__input" placeholder="Ingrese ID de usuario"
                            required>
                    </div>
                    <button type="submit" class="btn btn--primary">Buscar Usuario</button>
                </form>
                <div id="resultadoUsuario" class="form__error"></div>
            </div>
        </section>

        <!-- Formulario de registro de tareas -->
        <section class="form-section hidden" id="taskSection">
            <div class="card">
                <h2 class="card__title">Registrar Tarea</h2>
                <form id="formTarea" class="form" novalidate>
                    <div class="form__group">
                        <label for="tareaTitulo" class="form__label">Título de la tarea</label>
                        <input type="text" id="tareaTitulo" class="form__input" placeholder="Ej. Comprar leche"
                            required>
                    </div>
                    <div class="form__group">
                        <label for="tareaDescripcion" class="form__label">Descripción</label>
                        <textarea id="tareaDescripcion" class="form__input form__textarea"
                            placeholder="Detalles de la tarea..." required></textarea>
                    </div>
                    <div class="form__group">
                        <label for="tareaEstado" class="form__label">Estado</label>
                        <select id="tareaEstado" class="form__input" required>
                            <option value="pendiente">Pendiente</option>
                            <option value="en-progreso">En Progreso</option>
                            <option value="completada">Completada</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn--primary">Registrar Tarea</button>
                </form>
            </div>
        </section>

        <!-- Formulario de edición de tareas -->
        <section class="form-section hidden" id="editTaskSection">
            <div class="card">
                <h2 class="card__title">Editar Tarea</h2>
                <form id="formEditarTarea" class="form" novalidate>
                    <input type="hidden" id="editTareaId">
                    <div class="form__group">
                        <label for="editTareaTitulo" class="form__label">Título de la tarea</label>
                        <input type="text" id="editTareaTitulo" class="form__input" placeholder="Ej. Comprar leche"
                            required>
                    </div>
                    <div class="form__group">
                        <label for="editTareaDescripcion" class="form__label">Descripción</label>
                        <textarea id="editTareaDescripcion" class="form__input form__textarea"
                            placeholder="Detalles de la tarea..." required></textarea>
                    </div>
                    <div class="form__group">
                        <label for="editTareaEstado" class="form__label">Estado</label>
                        <select id="editTareaEstado" class="form__input" required>
                            <option value="pendiente">Pendiente</option>
                            <option value="en-progreso">En Progreso</option>
                            <option value="completada">Completada</option>
                        </select>
                    </div>
                    <div class="form__group">
                        <label for="editTareaUsuario" class="form__label">ID de Usuario Asignado</label>
                        <input type="number" id="editTareaUsuario" class="form__input"
                            placeholder="ID del usuario asignado" required>
                    </div>
                    <div class="buttons-card">
                        <button type="submit" class="btn btn--primary">Guardar Cambios</button>
                        <button type="button" id="btnCancelarEdicion" class="btn btn--secondary">Cancelar</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Área de tareas -->
        <section class="messages-section hidden" id="tasksListSection">
            <div class="messages-header">
                <h2 class="messages-header__title">Tareas Registradas</h2>
                <div class="messages-header__actions">
                    <span class="messages-header__count" id="taskCount">0 tareas</span>
                    <button id="btnExportarTareas" class="btn btn--secondary btn--sm">Exportar JSON</button>
                </div>
            </div>

            <!-- Filtros y Ordenamiento (RF01 & RF02) -->
            <div class="filters-card">
                <div class="filters-card__title">Filtros y Ordenamiento</div>
                <div class="filters-grid">
                    <div class="form__group">
                        <label for="filterEstado" class="form__label">Estado</label>
                        <select id="filterEstado" class="form__input">
                            <option value="todos">Todos los estados</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="en-progreso">En Progreso</option>
                            <option value="completada">Completada</option>
                        </select>
                    </div>
                    <div class="form__group">
                        <label for="filterUsuario" class="form__label">Usuario asignado</label>
                        <select id="filterUsuario" class="form__input">
                            <option value="todos">Todos los usuarios</option>
                        </select>
                    </div>
                    <div class="form__group">
                        <label for="sortCriterio" class="form__label">Ordenar por</label>
                        <select id="sortCriterio" class="form__input">
                            <option value="fecha">Fecha de creación</option>
                            <option value="nombre">Nombre de la tarea</option>
                            <option value="estado">Estado</option>
                        </select>
                    </div>
                    <div class="form__group">
                        <label for="sortDireccion" class="form__label">Dirección</label>
                        <select id="sortDireccion" class="form__input">
                            <option value="desc">Descendente</option>
                            <option value="asc">Ascendente</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="tasksContainer" class="messages-container">
                <!-- Las tareas se agregarán aquí dinámicamente -->
            </div>
        </section>
    </main>
    <script type="module" src="./src/app/index.js"></script>
</body>

</html>
